# Configuration and build files that cannot or must not carry a header:
# validate.yml is the CI workflow this item must not modify; the .gitignore
# files are declared here for uniform treatment with the experiment-directory
# ones (the experiment files are pinned byte-for-byte by delivery evidence; the
# root and .aclt-flow ones are regenerable or ordinary ignores); the two JSON
# files are read by strict parsers that reject comments; state3's Cargo.toml
# stays a manifest like the historical ones above.
[[annotations]]
path = [
  ".aclt-flow/.gitignore",
  ".aclt-flow/template.json",
  ".github/workflows/validate.yml",
  ".gitignore",
  "DELIVERY-SCOPE.json",
  "experiments/aclt-minimal-verifier/.gitignore",
  "experiments/aclt-minimal-verifier-state2/.gitignore",
  "experiments/aclt-minimal-verifier-state3/.gitignore",
  "experiments/aclt-minimal-verifier-state3/Cargo.toml",
]
precedence = "closest"
SPDX-FileCopyrightText = "Copyright 2026 北京凌矩阵科技有限责任公司"
SPDX-License-Identifier = "Apache-2.0"
