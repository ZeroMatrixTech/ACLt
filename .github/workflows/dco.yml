name: DCO sign-off
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check pull request sign-offs
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: python3 -B scripts/check-dco.py pr --base "$BASE" --head "$HEAD" --fork "$FORK"
      - name: Check main sign-offs
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 -B scripts/check-dco.py push --before "$BEFORE" --after "$AFTER"
