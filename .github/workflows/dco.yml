name: DCO sign-off
# Trust boundary: for pull requests this uses pull_request_target, so the
# workflow and scripts/check-dco.py come from the target branch's current
# commit (github.sha), never from the pull request. The pull request's
# recorded base commit may predate this script, so the trusted checkout must
# not use github.event.pull_request.base.sha. The pull request is checked out
# into pr/ as data only; nothing from it is executed, no secrets are used, and
# the token is read-only and not persisted.
#
# The pull request body is untrusted. It is the only such field this check
# reads: the step below passes it in the PR_BODY environment variable and the
# trusted script picks it up by name (--body-env), so it is never interpolated
# into a run: command, never executed, and never written to GITHUB_ENV or
# GITHUB_OUTPUT. The title and the head branch name are not used at all.
#
# The squash merge takes its commit message from the pull request body, so the
# body must end with a Signed-off-by trailer from a sign-off identity in
# .github/dco-maintainers.txt before the merge; the edited activity type reruns
# the check when the signer adds it. The list holds the maintainer and the human
# collaborator the maintainer authorised, and it comes from inside the trusted
# checkout, so a pull request that edits that file is still judged by the target
# branch's copy.
#
# Until a fork pull request has shown on the public repository that this check
# blocks merging when a sign-off is missing and passes on the fixed head, its
# result for external pull requests is advisory; the maintainer verifies
# locally before merging (CONTRIBUTING section 11).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dco-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the trusted checker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pull request commits as data
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Check pull request sign-offs
        if: github.event_name == 'pull_request_target'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -B trusted/scripts/check-dco.py --repo pr pr --base "$BASE" --head "$HEAD" --fork "$FORK" --body-env PR_BODY
      - name: Check main sign-offs
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 -B trusted/scripts/check-dco.py --repo trusted push --before "$BEFORE" --after "$AFTER"
