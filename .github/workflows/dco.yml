# SPDX-License-Identifier: Apache-2.0
name: DCO sign-off
# PR policy and sign-off checks run from the trusted target branch.
# PR content is passed as data; the token has read-only permissions.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: dco-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply organization contribution policy
        if: github.event_name == 'pull_request_target'
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          HEAD_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
          BASE_OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PYTHON'
          import os
          association = os.environ['AUTHOR_ASSOCIATION']
          same_owner = os.environ['HEAD_OWNER'].casefold() == os.environ['BASE_OWNER'].casefold()
          if association not in ('OWNER', 'MEMBER') or not same_owner:
              raise SystemExit('Organization-external pull requests are paused by the maintainer.')
          print('PASS: organization contribution policy')
          PYTHON
      - name: Checkout the trusted checker
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pull request commits as data
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Check pull request sign-offs
        if: github.event_name == 'pull_request_target'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -B trusted/scripts/check-dco.py --repo pr pr --base "$BASE" --head "$HEAD" --fork "$FORK" --body-env PR_BODY
      - name: Check main sign-offs
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: python3 -B trusted/scripts/check-dco.py --repo trusted push --before "$BEFORE" --after "$AFTER"
